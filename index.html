<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wardrobe Refresh Top Spender</title>
  <meta name="description" content="her WARDROBE by KLAMBY · Wardrobe Refresh Top Spender leaderboard.">
  <meta name="theme-color" content="#F2ECE0">
  <link rel="icon" href="assets/icons.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fallback web fonts, used only until the brand font files are added to /fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Jost:wght@300..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kedebideri:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Vector flower used for the backdrop shapes and the badge (always sharp) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flower" viewBox="-100 -100 200 200">
      <g>
        <ellipse rx="34" ry="52" cy="-46"/>
        <ellipse rx="34" ry="52" cy="-46" transform="rotate(45)"/>
        <ellipse rx="34" ry="52" cy="-46" transform="rotate(90)"/>
        <ellipse rx="34" ry="52" cy="-46" transform="rotate(135)"/>
        <ellipse rx="34" ry="52" cy="-46" transform="rotate(180)"/>
        <ellipse rx="34" ry="52" cy="-46" transform="rotate(225)"/>
        <ellipse rx="34" ry="52" cy="-46" transform="rotate(270)"/>
        <ellipse rx="34" ry="52" cy="-46" transform="rotate(315)"/>
        <circle r="48"/>
      </g>
    </symbol>
  </svg>

  <div class="app" id="app">

    <!-- ================= TOP BAR ================= -->
    <header class="topbar">
      <img class="logo" data-asset="logo" alt="Wardrobe Refresh">
      <div class="refresh" id="refresh" role="status" aria-live="polite">
        <span class="refresh__dot" aria-hidden="true"></span>
        <span class="refresh__label" id="refreshLabel">Connecting…</span>
      </div>
    </header>

    <main class="stage">

      <!-- ================= PRIZE POSTER (main visual) ================= -->
      <section class="poster" aria-label="Prize">
        <div class="poster__title">
          <h1 class="headline" data-text="headline">Wardrobe Refresh</h1>
          <p class="subhead" data-text="campaignTitle">Top Spender</p>
        </div>

        <div class="prize-stage" id="prizeStage">
          <div class="prize" id="prize">
            <svg class="bloom bloom--big" aria-hidden="true"><use href="#flower"/></svg>
            <svg class="bloom bloom--small" aria-hidden="true"><use href="#flower"/></svg>
            <svg class="bloom bloom--tiny" aria-hidden="true"><use href="#flower"/></svg>
            <img class="prize__img" data-asset="prize" alt="Bodimax Treadmill, the prize for the Top 3">
            <div class="badge" aria-label="For 3 winners">
              <svg class="badge__flower" aria-hidden="true"><use href="#flower"/></svg>
              <span class="badge__text"><small>For</small><b>3</b><small>Winners</small></span>
            </div>
          </div>
        </div>

        <p class="poster__prize"><span data-text="prizeName">Bodimax Treadmill</span></p>
        <p class="poster__meta" data-text="campaignPeriod"></p>
      </section>

      <!-- ================= RANKING ================= -->
      <section class="ranking" aria-label="Ranking">

        <!-- #1 -->
        <article class="hero" aria-label="Rank 1">
          <div class="hero__rank">
            <svg class="crown" viewBox="0 0 32 24" aria-hidden="true"><path d="M2 20 4 6l7 6 5-10 5 10 7-6 2 14z"/></svg>
            <span>01</span>
          </div>
          <h2 class="hero__name" id="heroName">—</h2>
          <div class="hero__amount odo" id="heroAmount">—</div>
        </article>

        <!-- #2 and #3 -->
        <div class="podium" id="podium">
          <article class="podium__card podium__card--2" data-rank="2">
            <span class="podium__rank">02</span>
            <h3 class="podium__name">—</h3>
            <span class="podium__amount odo">—</span>
          </article>
          <article class="podium__card podium__card--3" data-rank="3">
            <span class="podium__rank">03</span>
            <h3 class="podium__name">—</h3>
            <span class="podium__amount odo">—</span>
          </article>
        </div>

        <!-- Controls (hidden in presentation mode) -->
        <nav class="controls" aria-label="Leaderboard controls">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Search name" autocomplete="off">
          </label>
          <div class="filter" role="radiogroup" aria-label="Show">
            <button class="filter__btn is-active" data-filter="all" role="radio" aria-checked="true">All</button>
            <button class="filter__btn" data-filter="10" role="radio" aria-checked="false">Top 10</button>
          </div>
          <button class="icon-btn" id="btnRefresh" title="Refresh (R)" aria-label="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
          </button>
          <button class="icon-btn" id="btnPresent" title="Presentation mode (P)" aria-label="Presentation mode">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>
          </button>
          <button class="icon-btn" id="btnFullscreen" title="Fullscreen (F)" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </nav>

        <div class="demo-banner" id="demoBanner" hidden>Demo data. Add your Google Sheet link in <code>js/config.js</code>.</div>

        <!-- Full list -->
        <div class="board">
          <div class="board__viewport" id="boardViewport">
            <ol class="board__list" id="boardList"></ol>
            <p class="board__empty" id="boardEmpty" hidden>No match.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>
      <span id="lastUpdated">—</span>
    </footer>
    <p class="legal" data-text="footerNote"></p>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
