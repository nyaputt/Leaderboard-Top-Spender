<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top Spenders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#563643;--bg2:#6a4557;--deep:#3d2230;--ink:#F6EEE6;--mute:#cdb8c2;--line:rgba(246,238,230,.17);
--gold:#D2C06A;--silver:#C3D9E7;--bronze:#D4A073;--up:#a9d9b0;--dn:#f0a9a9;--serif:'Ambroise Francois','Bodoni Moda','Didot',Georgia,serif;--sans:'Kedebideri','Figtree',system-ui,sans-serif;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:radial-gradient(900px 520px at 50% 0,#70485c,transparent 70%),var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
#prog{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;z-index:20}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{font:600 22px var(--serif);letter-spacing:.02em}
.meta{color:var(--mute);font-size:14px;display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:8px}
.dot.live{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}
.hero{position:relative;isolation:isolate;padding:80px 0 40px;text-align:center}
.hero::before{content:'';position:absolute;left:50%;top:0;width:min(640px,100%);aspect-ratio:1;translate:-50% 0;background:radial-gradient(closest-side,color-mix(in srgb,var(--gold) 30%,transparent),transparent);filter:blur(30px);z-index:-1;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{translate:-40% 14%;scale:1.18}}
h1{font:400 clamp(42px,9vw,96px)/1.02 var(--serif);letter-spacing:-.01em}
h1 span{display:inline-block;animation:up .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.12s)}
@keyframes up{from{opacity:0;transform:translateY(40px)}}
.sub{color:var(--mute);margin-top:16px;font-size:18px;animation:up 1s .5s backwards}
.ticker{overflow:hidden;border-block:1px solid var(--line);padding:12px 0;color:var(--mute);font:italic 18px var(--serif);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.tk{display:flex;width:max-content;animation:mq 45s linear infinite}
.ticker:hover .tk{animation-play-state:paused}
.tk>*{margin-right:28px;white-space:nowrap}.tk i{color:var(--gold);font-size:11px;align-self:center;font-style:normal}
@keyframes mq{to{transform:translateX(-33.3333%)}}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:clamp(8px,2vw,28px);align-items:end;padding:56px 0 24px}
.pc{position:relative;text-align:center;cursor:pointer;transition:transform .2s ease-out;-webkit-tap-highlight-color:transparent}
.pc::before{content:'';position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,30%),color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:1}
.pc:hover::before{opacity:1}
.pc.r1{--c:var(--gold);--h:150px}.pc.r2{--c:var(--silver);--h:104px}.pc.r3{--c:var(--bronze);--h:72px}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards}
.rise.r2{animation-delay:.5s}.rise.r3{animation-delay:.8s}.rise.r1{animation-delay:1.1s}
@keyframes rise{from{opacity:0;transform:translateY(140px)}}
.pop{animation:pop .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pop{from{opacity:.2;transform:scale(.95)}}
.top{display:flex;flex-direction:column;align-items:center;padding:0 4px 22px}
.num{display:none}
.badge{font-size:12px;font-weight:600;padding:3px 14px;border-radius:99px;margin-bottom:12px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.r1 .badge{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.avw{position:relative;width:max-content}
.avw::after{content:'';position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--ink) 14%,transparent) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:fill 1.6s 1.2s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fill{from{--p:0}}
.r1 .avw::before{content:'';position:absolute;inset:-12px;border-radius:50%;box-shadow:0 0 44px color-mix(in srgb,var(--gold) 60%,transparent);animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.3}}
.cheer .avw{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{40%{transform:translateY(-14px) scale(1.06)}}
.spk{position:absolute;left:var(--x);top:var(--y);color:var(--gold);font-size:15px;font-style:normal;animation:tw 2.4s var(--d) infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--deep);display:grid;place-items:center;font:600 28px var(--serif);color:var(--c);border:2px solid var(--c)}
.r1 .av{width:116px;height:116px;font-size:38px}
.pc h3{font:600 clamp(18px,2.4vw,28px)/1.2 var(--serif);margin-top:16px;overflow-wrap:anywhere}
.amt{font-weight:600;color:var(--c);margin-top:6px;font-size:clamp(15px,1.8vw,20px);font-variant-numeric:tabular-nums}
.tier{display:inline-block;margin-top:10px;font-size:12px;color:var(--mute);border:1px solid var(--line);padding:2px 12px;border-radius:99px}
.gap{margin-top:10px;font-size:13px;color:var(--mute)}
.step{position:relative;overflow:hidden;display:grid;place-items:center;height:var(--h);border-top:3px solid var(--c);border-radius:8px 8px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 34%,var(--deep)),var(--deep))}
.step b{font:italic 400 clamp(48px,8vw,96px)/1 var(--serif);color:var(--c)}
.r1 .step::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%) 0 0/250% 100%;animation:sheen 4.5s linear infinite}
@keyframes sheen{to{background-position:-250% 0}}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;z-index:25;pointer-events:none;padding:0 16px}
.toast{background:var(--deep);border:1px solid var(--line);border-radius:99px;padding:10px 18px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:toast 4.2s both}
.toast::before{content:'▲ ';color:var(--up)}
@keyframes toast{0%{opacity:0;transform:translateY(20px)}8%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
h2{font:400 clamp(30px,4vw,44px)/1.1 var(--serif);margin-bottom:28px}
section{padding:72px 0 0}
.item{border-top:1px solid var(--line)}.item:last-child{border-bottom:1px solid var(--line)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--d,0s),transform .7s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.rv.in{opacity:1;transform:none}
.row{display:grid;grid-template-columns:64px 48px 1fr auto;gap:16px;align-items:center;padding:18px 8px;cursor:pointer;transition:background .2s}
.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}.row:hover .nm{color:var(--gold)}
.row .rk{font:italic 400 34px var(--serif);color:var(--mute)}
.row .av{width:44px;height:44px;font-size:16px;border:1px solid var(--line);color:var(--ink)}
.nm{font-weight:500;transition:color .2s}.tr{color:var(--mute);font-size:13px}
.am{font-weight:600;font-variant-numeric:tabular-nums}
.mv{font-size:11px;margin-left:8px;font-weight:600}.mv.up{color:var(--up)}.mv.dn{color:var(--dn)}.mv.nw{color:var(--gold)}
.bar{height:2px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--gold);transform:scaleX(var(--w));transform-origin:left;transition:transform 1.2s cubic-bezier(.2,.8,.2,1) .2s}
.rv:not(.in) .bar i{transform:scaleX(0)}
.dt{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.item.open .dt{grid-template-rows:1fr}
.dt>div{overflow:hidden;display:flex;flex-wrap:wrap;gap:8px 36px;font-size:15px;padding:0 8px}
.item.open .dt>div{padding:16px 8px 20px}
.dt span{display:block;font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px}
.stat b{display:block;font:400 clamp(28px,3.4vw,40px)/1.15 var(--serif);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{color:var(--mute);font-size:14px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
input,select,button{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
input{flex:1;min-width:200px}
button{cursor:pointer}button:hover,input:focus,select:hover{border-color:var(--gold)}
.more{margin:28px auto 0;display:block}
.note{color:var(--mute);padding:48px 0;text-align:center}.err{color:var(--dn)}
footer{padding:72px 0 48px;color:var(--mute);font-size:13px;text-align:center}
@media(max-width:720px){
.wrap{padding:0 16px}
.hero{padding:56px 0 32px}
section{padding-top:56px}
.podium{grid-template-columns:1fr;gap:14px;padding-top:36px}
.pc.r1{order:-1}
.step{display:none}
.top{display:grid;grid-template-columns:auto auto 1fr;grid-template-areas:"n a b" "n a h" "n a m" "n a t" "n a g";column-gap:14px;align-items:center;justify-items:start;text-align:left;padding:16px;background:color-mix(in srgb,var(--c) 12%,var(--deep));border-radius:16px;border-left:4px solid var(--c)}
.r1 .top{padding:24px 16px}
.num{display:block;grid-area:n;font:italic 400 44px var(--serif);color:var(--c)}.r1 .num{font-size:60px}
.avw{grid-area:a}.badge{grid-area:b;margin:0 0 2px}.pc h3{grid-area:h;margin:0;font-size:19px}.r1 h3{font-size:22px}
.amt{grid-area:m;margin:2px 0 0}.tier{grid-area:t;margin:4px 0 0}.gap{grid-area:g;margin:4px 0 0}
.av{width:60px;height:60px;font-size:20px}.r1 .av{width:76px;height:76px;font-size:24px}
.row{grid-template-columns:34px 40px 1fr;gap:4px 12px;padding:14px 4px}
.row .rk{font-size:26px}.row .am{grid-column:3}
.tools>*{flex:1 1 100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="prog"></div><canvas id="fx"></canvas><div id="toasts"></div>
<div class="wrap">
<header>
  <div class="brand" id="brand">Wardrobe Refresh</div>
  <div class="meta"><span id="campaign"></span><span id="period"></span><span><i class="dot live" id="dot"></i><span id="updated">Loading…</span></span></div>
</header>

<main id="main" aria-live="polite">
  <div class="hero">
    <h1><span style="--i:1">Top</span> <span style="--i:2">Spenders</span></h1>
    <p class="sub">Akumulasi belanja selama periode pada data</p>
  </div>
  <div id="ticker" class="ticker" aria-hidden="true" hidden></div>
  <div id="state" class="note">Loading the leaderboard…</div>
  <div class="podium" id="podium" hidden></div>
  <section id="board" hidden><h2>Ranks 4 to 10</h2><div id="list"></div></section>
  <section id="statsec" hidden><h2>The numbers</h2><div class="stats" id="stats"></div></section>
  <section id="dir" hidden>
    <h2>All customers</h2>
    <div class="tools">
      <input id="q" type="search" placeholder="Search by name" aria-label="Search by name">
      <select id="tierSel" aria-label="Filter by tier"></select>
      <select id="sortSel" aria-label="Sort"><option value="desc">Highest spending</option><option value="asc">Lowest spending</option></select>
    </div>
    <div id="full"></div>
    <button class="more" id="more" hidden>Show more</button>
  </section>
</main>
<footer id="foot"></footer>
</div>

<script>
/* ===== CONFIG: paste your Apps Script Web App URL below ===== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwRPEcszfXFfTg18oQiKXpS-CiJD73iMZ9REYY6rYJ_tEDnRC5jGMznljo96ouhZg5M/exec',
  BRAND: 'Wardrobe Refresh',        // used when the Config sheet has no "brand" row
  REFRESH_SECONDS: 45,
  TOP_N: 10,
  PAGE_SIZE: 25,
  LOCALE: 'id-ID', CURRENCY: 'IDR'
};

/* ===== Helpers ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idr = n => new Intl.NumberFormat(CONFIG.LOCALE, {style:'currency',currency:CONFIG.CURRENCY,maximumFractionDigits:0}).format(n);
const FMT = [n => n.toLocaleString(CONFIG.LOCALE), idr, idr, idr];
const pick = (o, keys) => { for (const k of Object.keys(o)) if (keys.includes(k.toLowerCase().replace(/[\s_]/g,''))) return o[k]; };
const initials = n => n.split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
const MAIN = /^(customername|name|customer|totalspending|spending|total|amount|profileimage|image|avatar|photo|membertier|tier|membership)$/;
const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;
const state = { all:[], total:0, shown:CONFIG.PAGE_SIZE, lastKey:'', fullKey:'', ranks:null, spends:{}, first:true };

/* ===== Data layer ===== */
async function loadData() {
  if (!CONFIG.API_URL) return demoData();
  const res = await fetch(CONFIG.API_URL, {cache:'no-store'});
  if (!res.ok) throw new Error('The spreadsheet service returned an error (' + res.status + ').');
  return res.json();
}
function normalize(raw) {
  const list = raw.customers.map(o => ({
    name: String(pick(o, ['customername','name','customer']) ?? '').trim(),
    spend: Number(String(pick(o, ['totalspending','spending','total','amount']) ?? 0).replace(/[^\d.-]/g,'')) || 0,
    img: String(pick(o, ['profileimage','image','avatar','photo']) ?? '').trim(),
    tier: String(pick(o, ['membertier','tier','membership']) ?? '').trim(),
    extra: o
  })).filter(c => c.name);
  list.sort((a,b) => b.spend - a.spend || a.name.localeCompare(b.name));
  list.forEach((c,i) => c.rank = i + 1);            // rank is always computed here, from spending
  return list;
}
function demoData() {   // preview only; used when API_URL is empty. Values shuffle so you can see rank changes.
  const names = ['Adinda Prameswari','Bagas Wicaksono','Citra Lestari','Dimas Anggara','Elisabeth Tan','Farhan Maulana','Gita Savitri','Hendra Kusuma','Intan Permata','Joko Santoso','Kirana Putri','Lukman Hakim','Maya Kusumawati','Nanda Pratama'];
  const tiers = ['VIP','Gold','Silver'];
  return {updatedAt:new Date().toISOString(), config:{campaign:'Preview mode: sample data',period:'Rankings reshuffle every few seconds'},
    customers:names.map((n,i)=>({'Customer Name':n,'Total Spending':Math.round((26e6-i*1.6e6)*(0.88+Math.random()*.24)),'Profile Image':'','Member Tier':tiers[Math.min(2,Math.floor(i/4))],'City':['Jakarta','Bandung','Surabaya','Semarang'][i%4]}))};
}

/* ===== Motion helpers ===== */
function countTo(el, to, from = 0, fmt = idr) {
  if (REDUCED || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  (function f(t) { const p = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e)); if (p < 1) requestAnimationFrame(f); })(t0);
}
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; const t = e.target; io.unobserve(t);
  if (t.dataset.to) countTo(t, +t.dataset.to, 0, FMT[t.dataset.f]); else t.classList.add('in');
}), {threshold:.15});
const cv = $('fx'), cx = cv.getContext('2d'); let ps = [], raf = 0;
function burst(x, y, main) {
  if (REDUCED) return; cv.width = innerWidth; cv.height = innerHeight;
  const css = getComputedStyle(document.documentElement), cols = ['--gold','--silver','--bronze','--ink'].map(v => css.getPropertyValue(v).trim());
  for (let i = 0; i < 80; i++) { const a = Math.random() * 6.283, s = 3 + Math.random() * 8;
    ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:5+Math.random()*5,h:3+Math.random()*4,r:0,vr:Math.random()*.3-.15,c:(main && i%2) ? main : cols[i%4],l:1}); }
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height); ps = ps.filter(p => p.l > 0);
  ps.forEach(p => { p.vy += .25; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.l -= .011;
    cx.save(); cx.globalAlpha = Math.max(p.l, 0); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w/2, -p.h/2, p.w, p.h); cx.restore(); });
  raf = ps.length ? requestAnimationFrame(loop) : 0;
}

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('toasts').append(t); setTimeout(() => t.remove(), 4300); }

/* ===== Rendering ===== */
const av = (c, cls='') => c.img ? `<img class="av ${cls}" src="${esc(c.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="av ${cls}" aria-hidden="true">${esc(initials(c.name))}</div>`;
const tierTag = c => c.tier ? `<span class="tier">${esc(c.tier)}</span>` : '';
function mvTag(c) {
  const p = state.ranks; if (!p) return ''; const o = p[c.name];
  if (o == null) return '<span class="mv nw">new</span>';
  const d = o - c.rank; return d > 0 ? `<span class="mv up">▲${d}</span>` : d < 0 ? `<span class="mv dn">▼${-d}</span>` : '';
}
function item(c, cls, i, mv) {
  const all = state.all, above = all[c.rank-2], below = all[c.rank];
  const gap = above ? `${idr(above.spend - c.spend)} behind #${above.rank}` : below ? `${idr(c.spend - below.spend)} ahead of #2` : '';
  const extras = Object.entries(c.extra).filter(([k,v]) => !MAIN.test(k.toLowerCase().replace(/[\s_]/g,'')) && String(v).trim()).map(([k,v]) => `<div><span>${esc(k)}</span>${esc(v)}</div>`).join('');
  return `<div class="item ${cls}" data-k="${esc(c.name)}" style="--d:${i*70}ms"><div class="row" tabindex="0" role="button" aria-expanded="false"><div class="rk">${c.rank}</div>${av(c)}
    <div><div class="nm">${esc(c.name)}${mv ? mvTag(c) : ''}</div><div class="tr">${esc(c.tier)}</div></div><div class="am">${idr(c.spend)}</div></div>
    <div class="bar"><i style="--w:${(c.spend / (all[0].spend || 1)).toFixed(3)}"></i></div>
    <div class="dt"><div><div><span>Share of total</span>${(c.spend / (state.total || 1) * 100).toFixed(1)}%</div>${gap ? `<div><span>Position</span>${gap}</div>` : ''}${extras}</div></div></div>`;
}
function renderPodium(top) {
  const cls = state.first ? 'rise' : 'pop', lead = top[0].spend || 1, ord = [top[1], top[0], top[2]].filter(Boolean);
  const titles = ['♛ Champion', 'Runner-up', 'Third place'];
  const gaps = [c => top[1] ? `Leading by ${idr(c.spend - top[1].spend)}` : '', c => `${idr(top[0].spend - c.spend)} to overtake #1`, c => `${idr(top[1].spend - c.spend)} to reach #2`];
  const spk = [[-18,4,0],[92,-2,.6],[100,62,1.2],[-22,66,1.8],[42,-18,.9]].map(([x,y,d]) => `<i class="spk" style="--x:${x}%;--y:${y}%;--d:${d}s">✦</i>`).join('');
  $('podium').innerHTML = ord.map(c => `<article class="pc r${c.rank} ${cls}" data-k="${esc(c.name)}" tabindex="0" aria-label="${esc(c.name)}, rank ${c.rank}. Press to celebrate">
    <div class="top"><div class="num">${c.rank}</div><div class="avw" style="--p:${Math.round(c.spend / lead * 100)}">${av(c)}${c.rank === 1 ? spk : ''}</div>
    <div class="badge">${titles[c.rank-1]}${mvTag(c)}</div><h3>${esc(c.name)}</h3><div class="amt">${idr(c.spend)}</div>${tierTag(c)}<div class="gap">${gaps[c.rank-1](c)}</div></div>
    <div class="step"><b>${c.rank}</b></div></article>`).join('');
  document.querySelectorAll('.amt').forEach((el, i) => countTo(el, ord[i].spend, state.spends[ord[i].name] || 0));
}
function renderList(rows) {
  const box = $('list'), first = new Map([...box.children].map(el => [el.dataset.k, el.getBoundingClientRect().top]));
  box.innerHTML = rows.map((c, i) => item(c, state.first ? 'rv' : 'in', i, true)).join('');
  [...box.children].forEach(el => {
    if (state.first) { io.observe(el); return; }
    const old = first.get(el.dataset.k); if (old == null) return;   // FLIP: slide rows to their new position
    const dy = old - el.getBoundingClientRect().top; if (dy) el.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:700,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}
function renderTicker(top) {
  const s = top.map(c => `<span>${esc(c.name)}</span><i>◆</i>`).join(''); $('ticker').innerHTML = `<div class="tk">${s}${s}${s}</div>`;
}
function renderStats(all) {
  const t = state.total, v = [all.length, t, all[0].spend, Math.round(t / all.length)], l = ['Customers','Total spending','Highest spending','Average per customer'];
  $('stats').innerHTML = v.map((n, i) => `<div class="stat"><b data-to="${n}" data-f="${i}">${FMT[i](state.first ? 0 : n)}</b><span>${l[i]}</span></div>`).join('');
  if (state.first) $('stats').querySelectorAll('b').forEach(b => io.observe(b));
}
function renderDirectory() {
  const q = $('q').value.trim().toLowerCase(), t = $('tierSel').value, asc = $('sortSel').value === 'asc';
  let rows = state.all.filter(c => (!q || c.name.toLowerCase().includes(q)) && (!t || c.tier === t));
  if (asc) rows = rows.slice().sort((a,b) => a.spend - b.spend);
  $('full').innerHTML = rows.length ? rows.slice(0, state.shown).map(c => item(c, 'in', 0, false)).join('')
    : '<div class="note">No customers match your search. Clear the filters to see everyone.</div>';
  $('more').hidden = rows.length <= state.shown;
}
function syncTierOptions() {
  const sel = $('tierSel'), cur = sel.value, tiers = [...new Set(state.all.map(c => c.tier).filter(Boolean))];
  sel.innerHTML = '<option value="">All tiers</option>' + tiers.map(t => `<option ${t===cur?'selected':''}>${esc(t)}</option>`).join('');
  sel.hidden = !tiers.length;
}

function render(raw) {
  const all = normalize(raw), cfg = raw.config || {};
  $('brand').textContent = cfg.brand || CONFIG.BRAND;
  $('campaign').textContent = cfg.campaign || ''; $('period').textContent = cfg.period || '';
  $('updated').textContent = 'Updated ' + new Date(raw.updatedAt).toLocaleString(CONFIG.LOCALE,{dateStyle:'medium',timeStyle:'short'});
  $('dot').classList.add('live');
  if (!all.length) { $('state').hidden = false; $('state').textContent = 'No customers yet. Add rows to the Spenders sheet and they will appear here.'; return; }
  $('state').hidden = true; $('state').className = 'note';
  ['ticker','podium','board','statsec','dir'].forEach(id => $(id).hidden = false);
  state.all = all; state.total = all.reduce((s,c) => s + c.spend, 0);
  const topKey = JSON.stringify(all.slice(0, CONFIG.TOP_N).map(c => [c.name, c.spend]));
  const fullKey = JSON.stringify(all.map(c => [c.name, c.spend, c.tier]));
  if (topKey !== state.lastKey) { renderPodium(all.slice(0,3)); renderList(all.slice(3, CONFIG.TOP_N)); renderTicker(all.slice(0, CONFIG.TOP_N)); state.lastKey = topKey; }
  if (fullKey !== state.fullKey) { renderStats(all); syncTierOptions(); renderDirectory(); state.fullKey = fullKey; }
  if (state.ranks) all.slice(0, CONFIG.TOP_N).map(c => ({c, d: (state.ranks[c.name] ?? 99) - c.rank})).filter(x => x.d > 0).sort((a,b) => b.d - a.d).slice(0, 2)
    .forEach(({c}) => toast(c.rank === 1 ? `${c.name} takes the #1 spot` : `${c.name} climbed to #${c.rank}`));
  state.ranks = Object.fromEntries(all.map(c => [c.name, c.rank]));
  state.spends = Object.fromEntries(all.map(c => [c.name, c.spend]));
  if (state.first) { state.first = false;
    setTimeout(() => { const c = document.querySelector('.pc.r1'); if (c) { const r = c.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/3); } }, 1900); }
  $('foot').textContent = 'Rankings are calculated from total spending and refresh automatically.';
}

async function refresh() {
  try { render(await loadData()); }
  catch (e) {
    $('dot').classList.remove('live');
    if (!state.all.length) { $('state').hidden = false; $('state').className = 'note err'; $('state').textContent = 'We could not load the leaderboard. Check that the Apps Script is deployed with access set to “Anyone”, then reload.'; }
    else $('updated').textContent = 'Connection lost. Showing the last update.';
  }
}

/* ===== Interaction ===== */
const pod = $('podium');
pod.addEventListener('pointermove', e => {
  const c = e.target.closest('.pc'); if (!c || REDUCED || e.pointerType !== 'mouse') return;
  const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  c.style.setProperty('--mx', x * 100 + '%'); c.style.setProperty('--my', y * 100 + '%');
  c.style.transform = `perspective(800px) rotateY(${(x - .5) * 10}deg) rotateX(${(.5 - y) * 10}deg)`;
});
pod.addEventListener('pointerout', e => { const c = e.target.closest('.pc'); if (c && !c.contains(e.relatedTarget)) c.style.transform = ''; });
pod.addEventListener('click', e => { const c = e.target.closest('.pc'); if (!c) return; const r = c.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/3, getComputedStyle(c).getPropertyValue('--c').trim()); c.classList.remove('cheer'); void c.offsetWidth; c.classList.add('cheer'); });
document.addEventListener('click', e => { const r = e.target.closest('.item .row'); if (r) r.setAttribute('aria-expanded', r.parentElement.classList.toggle('open')); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row,.pc')) { e.preventDefault(); e.target.click(); } });
addEventListener('scroll', () => { $('prog').style.transform = `scaleX(${scrollY / ((document.documentElement.scrollHeight - innerHeight) || 1)})`; }, {passive:true});
$('q').addEventListener('input', () => { state.shown = CONFIG.PAGE_SIZE; renderDirectory(); });
$('tierSel').addEventListener('change', () => { state.shown = CONFIG.PAGE_SIZE; renderDirectory(); });
$('sortSel').addEventListener('change', renderDirectory);
$('more').addEventListener('click', () => { state.shown += CONFIG.PAGE_SIZE; renderDirectory(); });
refresh(); setInterval(refresh, (CONFIG.API_URL ? CONFIG.REFRESH_SECONDS : 6) * 1000);
</script>
</body>
</html>
